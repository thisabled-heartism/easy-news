const DAYS = ["일","월","화","수","목","금","토"];
function formatDate(s) {
  const d = new Date(s);
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${DAYS[d.getDay()]})`;
}
function formatLongDate(s) {
  const d = new Date(s);
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${DAYS[d.getDay()]}요일`;
}

const CATEGORY_COLOR = {
  "사회":   { bg: "bg-purple-100", text: "text-purple-700", solid: "bg-purple-600" },
  "정치":   { bg: "bg-blue-100",   text: "text-blue-700",   solid: "bg-blue-600" },
  "문화":   { bg: "bg-pink-100",   text: "text-pink-700",   solid: "bg-pink-600" },
  "날씨":   { bg: "bg-amber-100",  text: "text-amber-700",  solid: "bg-amber-500" },
  "default":{ bg: "bg-gray-100",   text: "text-gray-700",   solid: "bg-gray-600" }
};
function catColor(c) { return CATEGORY_COLOR[c] || CATEGORY_COLOR.default; }

const app = document.getElementById("app");
let currentFilter = null;

function filterCat(cat) {
  currentFilter = cat;
  showList();
}

function showList() {
  window.scrollTo(0, 0);
  const items = currentFilter ? ARTICLES.filter(a => a.category === currentFilter) : ARTICLES;
  const featured = items[0];
  const rest = items.slice(1);

  app.innerHTML = `
    <div class="animate-fadeIn">
      <!-- 히어로 -->
      <div class="mb-10">
        <h1 class="text-4xl font-black tracking-tight text-gray-900 leading-tight mb-2">
          오늘의 쉬운 뉴스
        </h1>
        <p class="text-base text-gray-600">${currentFilter ? `'${currentFilter}' 카테고리` : "어려운 뉴스를 쉬운말로 풀어 드려요"}</p>
      </div>

      ${featured ? `
        <!-- 메인 뉴스 -->
        <button onclick="showDetail('${featured.id}')" class="block w-full text-left mb-8 bg-white border-3 border-gray-100 hover:border-purple-300 rounded-3xl p-8 group transition">
          <div class="flex items-start gap-6">
            <div class="w-24 h-24 rounded-2xl bg-gradient-to-br from-purple-100 to-purple-50 flex items-center justify-center text-5xl flex-shrink-0">
              ${featured.emoji}
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-3 flex-wrap">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-black ${catColor(featured.category).bg} ${catColor(featured.category).text}">
                  #${featured.category}
                </span>
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-black bg-yellow-300 text-yellow-900">
                  ⭐ 오늘의 뉴스
                </span>
                ${featured.aiGenerated ? `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-black bg-purple-100 text-purple-700">✨ Claude AI 변환</span>` : ""}
                ${featured.realNews ? `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-black bg-green-100 text-green-700">📰 실제 기사</span>` : ""}
              </div>
              <h2 class="text-2xl md:text-3xl font-black tracking-tight text-gray-900 leading-snug mb-3 group-hover:text-purple-700">
                ${featured.easyTitle}
              </h2>
              <p class="text-sm text-gray-500">${formatDate(featured.publishedAt)} · ${featured.source}</p>
            </div>
          </div>
        </button>
      ` : `
        <div class="text-center py-20 text-gray-500">이 카테고리에 뉴스가 없어요</div>
      `}

          <button onclick="showDetail('${a.id}')" class="text-left bg-white border-3 border-gray-100 hover:border-purple-300 rounded-2xl p-6 group transition">
            <div class="flex items-start gap-4">
              <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-purple-100 to-purple-50 flex items-center justify-center text-3xl flex-shrink-0">

                  ${a.realNews ? `<span class="inline-block px-2 py-0.5 rounded-full text-[10px] font-black bg-green-100 text-green-700">📰 실제</span>` : ""}
                </div>

            </div>
          </button>
        `).join("")}

    </div>
  `;

function showDetail(id) {
  const a = ARTICLES.find(x => x.id === id);
  if (!a) return;
  window.scrollTo(0, 0);
  const paragraphs = a.easyBody.split(/\n\s*\n/).filter(Boolean);
  const c = catColor(a.category);

  app.innerHTML = `
    <div class="animate-fadeIn max-w-3xl mx-auto">
      <button onclick="showList()" class="inline-flex items-center gap-1 text-sm font-bold text-purple-700 hover:text-purple-900 mb-6">
        ← 뉴스 목록으로
      </button>

      <article class="bg-white border-3 border-gray-100 rounded-3xl p-8 md:p-12">
        <div class="flex items-center gap-3 mb-6 flex-wrap">
          <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-purple-100 to-purple-50 flex items-center justify-center text-4xl">
            ${a.emoji}
          </div>
          <span class="inline-flex items-center px-3 py-1.5 rounded-full text-sm font-black ${c.bg} ${c.text}">
            #${a.category}
          </span>
          ${a.aiGenerated ? `<span class="inline-flex items-center px-3 py-1.5 rounded-full text-sm font-black bg-purple-100 text-purple-700">✨ Claude AI 변환</span>` : ""}
          ${a.realNews ? `<span class="inline-flex items-center px-3 py-1.5 rounded-full text-sm font-black bg-green-100 text-green-700">📰 실제 기사</span>` : ""}
        </div>

        <h1 class="text-3xl md:text-4xl font-black tracking-tight text-gray-900 leading-tight mb-4">
          ${a.easyTitle}
        </h1>

        <p class="text-sm text-gray-500 mb-6 pb-6 border-b-2 border-gray-100">
          ${formatLongDate(a.publishedAt)}
        </p>

        <button onclick="speak()" id="ttsBtn" class="inline-flex items-center gap-2 bg-purple-600 hover:bg-purple-700 text-white font-black px-5 py-3 rounded-full text-sm mb-8 shadow-sm">
          🔊 읽어 주기
        </button>

        <div class="easy-body text-gray-800" id="body">
          ${paragraphs.map(p => `<p>${p.replace(/\n/g,"<br>")}</p>`).join("")}
        </div>

        <div class="mt-12 p-6 rounded-2xl bg-gradient-to-br from-purple-50 to-yellow-50 border-2 border-purple-100">
          <div class="flex items-center gap-2 mb-3">
            <span class="text-lg">📎</span>
            <span class="font-black text-purple-900">원문 출처</span>

          <p class="text-sm text-gray-700 mb-3">${a.source}</p>
          <a href="${a.sourceUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-sm font-bold text-purple-700 hover:text-purple-900 underline underline-offset-4">
            원문 기사 보러 가기 →
          </a>
        </div>
      </article>
    </div>
  `;
}

function speak() {
  const text = document.getElementById("body").innerText;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ko-KR";
  u.rate = 0.9;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
  const btn = document.getElementById("ttsBtn");
  if (btn) {
    btn.innerText = "⏸ 잠시 멈춤";
    u.onend = () => { if (btn) btn.innerHTML = "🔊 읽어 주기"; };
  }
}

showList();
</script>
